name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan Git history for secrets
        run: pnpm security:secrets

      - name: Test audit policy
        run: pnpm test:security

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Audit all dependencies
        run: pnpm security:audit

      - name: Check formatting and lint
        run: pnpm check

      - name: Run linter
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Check JavaScript budget
        run: pnpm perf:js-budget

      - name: Run Lighthouse CI
        run: pnpm perf:lhci
